<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Sampathirao Yoganandh</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0F1117;--surf:#181C27;--surf2:#1F2333;--bdr:#2A2F42;--acc:#F07C3E;--gold:#E8C06A;--txt:#E8EAF0;--muted:#6B7194;--grn:#4ECBA0;--red:#F05C5C}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surf);border-bottom:1px solid var(--bdr);padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:1em;font-weight:700;color:var(--gold)}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:18px;padding:40px 36px;width:100%;max-width:420px}
.card-icon{font-size:2.4em;text-align:center;margin-bottom:10px}
.card h1{font-size:1.4em;font-weight:800;text-align:center;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:.85em;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:18px}
label{display:block;font-size:.8em;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:11px 14px;background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;color:var(--txt);font-size:.95em;outline:none;transition:.2s}
input:focus{border-color:var(--acc)}
input::placeholder{color:var(--muted)}
.btn{width:100%;padding:13px;background:var(--acc);border:none;border-radius:10px;color:#111;font-size:1em;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--gold)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:rgba(240,92,92,.1);border:1px solid rgba(240,92,92,.3);color:var(--red);border-radius:8px;padding:10px 14px;font-size:.85em;margin-bottom:16px;display:none}
.suc{background:rgba(78,203,160,.1);border:1px solid rgba(78,203,160,.3);color:var(--grn);border-radius:8px;padding:10px 14px;font-size:.85em;margin-bottom:16px;display:none}
.switch{text-align:center;font-size:.85em;color:var(--muted);margin-top:20px}
.switch a{color:var(--acc);text-decoration:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#111;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">sampathirao yoganandh</div>
  <a href="login.html" style="font-size:.82em;color:var(--muted);text-decoration:none">← Login</a>
</div>
<div class="page">
  <div class="card" id="requestCard">
    <div class="card-icon">🔑</div>
    <h1>Forgot Password</h1>
    <p class="sub">Enter your Roll Number — we'll send a reset link to your email</p>
    <div class="err" id="reqErr"></div>
    <div class="suc" id="reqSuc"></div>
    <div class="form-group">
      <label>Roll Number</label>
      <input type="text" id="rollNo" placeholder="e.g. 23CM9A0501">
    </div>
    <button class="btn" onclick="requestReset()">Send Reset Link</button>
    <div class="switch"><a href="login.html">Back to Login</a></div>
  </div>

  <div class="card" id="resetCard" style="display:none">
    <div class="card-icon">🔒</div>
    <h1>Set New Password</h1>
    <p class="sub">Enter your new password below</p>
    <div class="err" id="rstErr"></div>
    <div class="suc" id="rstSuc"></div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPass" placeholder="Min. 6 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confPass" placeholder="Repeat password">
    </div>
    <button class="btn" onclick="confirmReset()">Reset Password</button>
  </div>
</div>

<script>
  const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000/api' : '/api';

  const token = new URLSearchParams(window.location.search).get('token');
  if (token) {
    document.getElementById('requestCard').style.display = 'none';
    document.getElementById('resetCard').style.display = 'block';
  }

  async function requestReset() {
    const rollNo = document.getElementById('rollNo').value.trim();
    const err = document.getElementById('reqErr');
    const suc = document.getElementById('reqSuc');
    err.style.display='none'; suc.style.display='none';
    if (!rollNo){ err.textContent='Enter your roll number.'; err.style.display='block'; return; }
    try {
      const res = await fetch(`${API}/reset/request`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ rollNo })
      });
      const data = await res.json();
      suc.textContent = data.message; suc.style.display='block';
    } catch(e){ err.textContent='Something went wrong.'; err.style.display='block'; }
  }

  async function confirmReset() {
    const pass  = document.getElementById('newPass').value;
    const conf  = document.getElementById('confPass').value;
    const err   = document.getElementById('rstErr');
    const suc   = document.getElementById('rstSuc');
    err.style.display='none'; suc.style.display='none';
    if (pass.length < 6){ err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
    if (pass !== conf){ err.textContent='Passwords do not match.'; err.style.display='block'; return; }
    try {
      const res = await fetch(`${API}/reset/confirm`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, password: pass })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      suc.textContent = data.message + ' Redirecting to login...'; suc.style.display='block';
      setTimeout(()=> window.location.href='login.html', 2000);
    } catch(e){ err.textContent=e.message; err.style.display='block'; }
  }
</script>
</body>
</html>
